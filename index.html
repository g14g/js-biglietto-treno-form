<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Esercizio Javascript / Biglietto Treno</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous" />
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="container">
            <div class="row my-12">
                <div class="col-12">
                    <h1>Esercizio Biglietto Treno</h1>
                </div>
            </div>
            <div class="row my-12">
                <div class="col-12 mb-6">
                    <h2>Inserimento Dati</h2>
                </div>
                <div class="col-12">
                    <form class="row gy-6 gx-3 align-items-center">
                        <div class="col-auto">
                            <label for="inputNome" class="form-label fg-3">Nome</label>
                            <input type="text" class="form-control" id="inputNome" placeholder="Nome" autocomplete="off" required />
                        </div>
                        <div class="col-auto">
                            <label for="inputCognome" class="form-label fg-3">Cognome</label>
                            <input type="text" class="form-control" id="inputCognome" placeholder="Cognome" autocomplete="off" required />
                        </div>
                        <div class="col-auto">
                            <label class="form-label fg-3" for="inputKm">Kilometri da percorrere</label>
                            <label class="form-control form-adorn">
                                <span class="form-adorn-text fg-3" aria-hidden="true">Km</span>
                                <input type="number" class="form-ghost" id="inputKm" min="0" value="" placeholder="0" autocomplete="off" required />
                            </label>
                        </div>
                        <div class="col-auto">
                            <label for="inputFasciaEta" class="form-label fg-3">Fascia di età</label>
                            <select class="form-control" id="inputFasciaEta" autocomplete="off" required>
                                <option value="">Seleziona fascia...</option>
                                <option value="Minorenni">Minorenni</option>
                                <option value="Maggiorenni">Maggiorenni</option>
                                <option value="Over 65">Over 65</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn-solid theme-warning" id="btnCalcola">Calcola</button>
                            <button type="reset" class="btn-solid theme-secondary" id="btnReset">Reset</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="row my-12">
                <div class="col-12 mb-6">
                    <h2>Biglietto</h2>
                </div>
                <div class="row gx-6">
                    <div class="col-auto">
                        <div class="p-6 border rounded-6 h-auto">
                            <h3 class="fg-3">Nome viaggiatore</h3>
                            <p class="output nome-viaggiatore m-0">&nbsp;</p>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="p-6 border rounded-6 h-auto">
                            <h3 class="fg-3">Prezzo intero</h3>
                            <p class="output prezzo-intero text-end m-0">&nbsp;</p>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="p-6 border rounded-6 h-auto">
                            <h3 class="fg-3">Fascia di età - Sconto</h3>
                            <p class="output sconto-fascia-eta text-center m-0">&nbsp;</p>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="p-6 border rounded-6 h-auto">
                            <h3 class="fg-3">Prezzo finale</h3>
                            <p class="output prezzo-finale text-end m-0">&nbsp;</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
