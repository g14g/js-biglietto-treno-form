<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Esercizio Javascript / Biglietto Treno</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous" />
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="container">
            <div class="row my-12">
                <div class="col-12">
                    <h1>Esercizio Biglietto Treno</h1>
                </div>
            </div>
            <div class="row my-12">
                <div class="col-12">
                    <h2>Inserimento Dati</h2>
                    <form class="row gy-6 gx-3 align-items-center">
                        <div class="col-auto">
                            <label class="form-label fg-2" for="kmInput">Kilometri da percorrere</label>
                            <input type="number" class="form-control" id="kmInput" min="0" value="0" placeholder="0" autocomplete="off" required />
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn-solid theme-primary" id="btnCalcola">Calcola</button>
                            <button type="reset" class="btn-solid theme-secondary" id="btnReset">Reset</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="row my-12">
                <div class="col-12">
                    <form action=""></form>
                </div>
                <div class="col-12">
                    <h2>Biglietto</h2>
                </div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
